<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Mohamed Alaa</title>
    <link rel="icon" href="icons mohamed.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(67, 97, 238, 0.1) 0%, transparent 20%),
                        radial-gradient(circle at 90% 80%, rgba(247, 37, 133, 0.1) 0%, transparent 20%);
            z-index: -1;
        }

        .nav-container {
            background: rgba(15, 23, 42, 0.95);
            padding: 15px 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .nav-logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(45deg, #4361ee, #3a0ca3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-link {
            color: #e0e1dd;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 5px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(67, 97, 238, 0.2);
        }

        .nav-link:hover,
        .nav-link.active {
            background: linear-gradient(45deg, #4361ee, #3a0ca3);
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.4);
        }

        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            padding-top: 100px;
        }

        .login-card {
            background: rgba(27, 38, 59, 0.95);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card h2 {
            margin-bottom: 30px;
            color: #4cc9f0;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { display: block; margin-bottom: 8px; color: #e0e1dd; font-weight: 500; }
        .input-wrapper { position: relative; }

        input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus { outline: none; border-color: #4cc9f0; box-shadow: 0 0 0 2px rgba(76, 201, 240, 0.2); }
        .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888; }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary { background: linear-gradient(45deg, #4361ee, #3a0ca3); color: white; margin-top: 10px; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(67, 97, 238, 0.3); }
        .btn-secondary { background: transparent; border: 2px solid #4361ee; color: #4cc9f0; margin-top: 15px; }

        .divider { display: flex; align-items: center; margin: 25px 0; color: #888; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.1); }
        .divider span { padding: 0 15px; font-size: 0.9rem; }

        .social-login { display: flex; gap: 15px; margin-bottom: 25px; }
        .social-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-btn.google i { color: #DB4437; }
        .social-btn.github i { color: #333; }

        .links { margin-top: 25px; }
        .links a { color: #4cc9f0; text-decoration: none; font-size: 0.95rem; display: block; margin: 8px 0; }

        .message { padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: right; display: none; }
        .message.success { background: rgba(76, 175, 80, 0.1); border: 1px solid #4caf50; color: #4caf50; }
        .message.error { background: rgba(244, 67, 54, 0.1); border: 1px solid #f44336; color: #f44336; }
        .message.info { background: rgba(33, 150, 243, 0.1); border: 1px solid #2196f3; color: #2196f3; }

        .name-group { display: none; }
        .name-group.show { display: block; }

        footer { text-align: center; padding: 30px 0; margin-top: 40px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .social-icons { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .social-icon {
            width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #fff;
            text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s;
        }
        .social-icon:hover { background: #4361ee; transform: translateY(-5px); }

        @media (max-width: 768px) {
            .nav-content { flex-direction: column; gap: 15px; }
            .social-login { flex-direction: column; }
        }
    </style>
</head>
<body>
    <nav class="nav-container">
        <div class="nav-content">
            <a href="index.html" class="nav-logo">Mohamed Alaa</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">الرئيسية</a>
                <a href="login.html" class="nav-link active">دخول</a>
            </div>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="login-card">
            <h2 id="title"><i class="fas fa-user-circle"></i> تسجيل الدخول</h2>
            <div id="message" class="message"></div>
            
            <div class="input-group name-group" id="nameGroup">
                <label for="name">الاسم الكامل</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="name" placeholder="أدخل اسمك الكامل">
                </div>
            </div>
            
            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="example@email.com">
                </div>
            </div>
            
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور">
                </div>
            </div>
            
            <button class="btn btn-primary" id="loginBtn"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</button>
            <div class="divider"><span>أو</span></div>
            <button class="btn btn-secondary" id="signUpBtn"><i class="fas fa-user-plus"></i> إنشاء حساب جديد</button>
            
            <div class="social-login">
                <button class="social-btn google" id="googleLogin"><i class="fab fa-google"></i> Google</button>
                <button class="social-btn github" id="githubLogin"><i class="fab fa-github"></i> GitHub</button>
            </div>
            
            <div class="links">
                <a href="#" id="forgotPassword">نسيت كلمة المرور؟</a>
                <a href="index.html">العودة للرئيسية</a>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // إعدادات Firebase الحقيقية المستخرجة من صورك لمشروع MY-WEBSITE-1
        const firebaseConfig = {
            apiKey: "AIzaSyDP2FvUqV7pAt8pI1G1Mh8oxA_W6_O6Q0k",
            authDomain: "my-website-1-93db8.firebaseapp.com",
            projectId: "my-website-1-93db8",
            storageBucket: "my-website-1-93db8.firebasestorage.app",
            messagingSenderId: "811350331643",
            appId: "1:811350331643:web:03ccde538645de11f1488e",
            measurementId: "G-7H72L9ZKNC"
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // عناصر الصفحة
        const messageDiv = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');
        const signUpBtn = document.getElementById('signUpBtn');
        const nameGroup = document.getElementById('nameGroup');
        const title = document.getElementById('title');
        let isSignUpMode = false;

        function showMessage(type, text) {
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
            setTimeout(() => { messageDiv.style.display = 'none'; }, 5000);
        }

        // التبديل بين تسجيل الدخول وإنشاء الحساب
        signUpBtn.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            title.innerHTML = isSignUpMode ? '<i class="fas fa-user-plus"></i> إنشاء حساب' : '<i class="fas fa-user-circle"></i> تسجيل الدخول';
            loginBtn.innerHTML = isSignUpMode ? 'إنشاء الحساب' : 'تسجيل الدخول';
            signUpBtn.innerHTML = isSignUpMode ? 'لدي حساب بالفعل' : 'إنشاء حساب جديد';
            nameGroup.classList.toggle('show');
        });

        // تنفيذ الدخول أو التسجيل
        loginBtn.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;

            try {
                if (isSignUpMode) {
                    const res = await auth.createUserWithEmailAndPassword(email, password);
                    await db.collection('users').doc(res.user.uid).set({
                        name: name,
                        email: email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                }
                window.location.href = "index.html";
            } catch (error) {
                showMessage('error', error.message);
            }
        });

        // تسجيل الدخول بـ Google
        document.getElementById('googleLogin').addEventListener('click', async () => {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                window.location.href = "index.html";
            } catch (error) {
                showMessage('error', error.message);
            }
        });
    </script>
</body>
</html>
