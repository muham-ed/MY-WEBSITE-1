<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Mohamed Alaa</title>
      <link rel="stylesheet" href="global.css">
    <link rel="icon" href="icons mohamed.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-card">
        <div class="logo">مسار التطور التقني</div>
        <h2 id="title">تسجيل الدخول</h2>
        
        <div id="message" class="message"></div>
        
        <!-- حقل الاسم (يظهر فقط عند إنشاء حساب جديد) -->
        <div class="input-group name-field" id="nameField">
            <input type="text" id="name" placeholder="الاسم الكامل">
        </div>
        
        <div class="input-group">
            <input type="email" id="email" placeholder="البريد الإلكتروني">
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="كلمة المرور">
        </div>
        
        <button class="btn btn-primary" id="mainBtn">دخول</button>
        
        <div class="divider">
            <span>أو</span>
        </div>
        
        <button class="btn btn-google" id="googleBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="20" alt="Google">
            الدخول بواسطة Google
        </button>
        
        <div class="toggle-mode" id="toggleMode">
            ليس لديك حساب؟ سجل الآن
        </div>
        
        <div class="back-home">
            <a href="index.html">
                <i class="fas fa-home"></i> العودة للرئيسية
            </a>
        </div>
        
        <div class="domain-note">
            <i class="fas fa-shield-alt"></i> نطاق آمن: GitHub Pages
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
