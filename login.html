<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Mohamed Alaa</title>
    <link rel="icon" href="icons mohamed.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(67, 97, 238, 0.1) 0%, transparent 20%),
                        radial-gradient(circle at 90% 80%, rgba(247, 37, 133, 0.1) 0%, transparent 20%);
            z-index: -1;
        }

        .nav-container {
            background: rgba(15, 23, 42, 0.95);
            padding: 15px 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .nav-logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(45deg, #4361ee, #3a0ca3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-link {
            color: #e0e1dd;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 5px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(67, 97, 238, 0.2);
        }

        .nav-link:hover,
        .nav-link.active {
            background: linear-gradient(45deg, #4361ee, #3a0ca3);
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.4);
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            margin: 100px 20px 40px;
            animation: fadeIn 0.6s ease;
        }

        .login-card {
            background: rgba(27, 38, 59, 0.9);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header .logo {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #4361ee, #3a0ca3, #4cc9f0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .login-header h2 {
            color: #4cc9f0;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #e0e1dd;
            font-size: 1rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #4cc9f0;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 1.2rem;
        }

        input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #4cc9f0;
            box-shadow: 0 0 0 3px rgba(76, 201, 240, 0.2);
        }

        input::placeholder {
            color: #666;
        }

        .name-field {
            display: none;
        }

        .name-field.show {
            display: block;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4361ee, #3a0ca3);
            color: white;
            margin: 20px 0;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(67, 97, 238, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-google {
            background: white;
            color: #444;
            border: 1px solid #ddd;
        }

        .btn-google:hover {
            background: #f5f5f5;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #888;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 15px;
            font-size: 0.9rem;
        }

        .toggle-mode {
            text-align: center;
            margin: 20px 0 0;
            color: #4cc9f0;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .toggle-mode:hover {
            color: white;
            text-decoration: underline;
        }

        .message {
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.95rem;
            text-align: right;
        }

        .message.error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid #f44336;
            color: #ff9999;
            display: block;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid #4caf50;
            color: #a5d6a5;
            display: block;
        }

        .message.info {
            background: rgba(33, 150, 243, 0.1);
            border: 1px solid #2196f3;
            color: #90caf9;
            display: block;
        }

        .forgot-password {
            text-align: left;
            margin: 15px 0 0;
        }

        .forgot-password a {
            color: #4cc9f0;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: white;
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #4cc9f0;
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
        }

        .back-home a:hover {
            color: white;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
        }

        .copyright {
            color: #e0e1dd;
            font-size: 0.9rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .nav-content {
                flex-direction: column;
                gap: 15px;
            }
            
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .login-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-container">
        <div class="nav-content">
            <a href="index.html" class="nav-logo">Mohamed Alaa</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">الرئيسية</a>
                <a href="Computer_basics.html" class="nav-link">أساسيات الحاسوب</a>
                <a href="Microsoft_Office.html" class="nav-link">Microsoft Office</a>
                <a href="data-analyst-course.html" class="nav-link">📊 Data Analyst</a>
                <a href="data-scientist-course.html" class="nav-link">🔬 Data Scientist</a>
                <a href="blogs.html" class="nav-link">المقالات</a>
                <a href="login.html" class="nav-link active">دخول</a>
            </div>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">مسار التطور التقني</div>
                <h2 id="formTitle">تسجيل الدخول</h2>
                <p>أهلاً بك في منصة التعلم</p>
            </div>

            <div id="message" class="message"></div>

            <div class="input-group name-field" id="nameField">
                <label>الاسم الكامل</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="name" placeholder="أدخل اسمك الثلاثي">
                </div>
            </div>

            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="example@email.com">
                </div>
            </div>

            <div class="input-group">
                <label>كلمة المرور</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="********">
                </div>
            </div>

            <button class="btn btn-primary" id="mainActionBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span id="btnText">تسجيل الدخول</span>
            </button>

            <div class="divider">
                <span>أو</span>
            </div>

            <button class="btn btn-google" id="googleBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="20" alt="Google">
                <span>الدخول بحساب Google</span>
            </button>

            <div class="forgot-password">
                <a href="#" id="forgotPassword">
                    <i class="fas fa-key"></i> نسيت كلمة المرور؟
                </a>
            </div>

            <div class="toggle-mode" id="toggleMode">
                <i class="fas fa-user-plus"></i> ليس لديك حساب؟ سجل الآن
            </div>

            <div class="back-home">
                <a href="index.html">
                    <i class="fas fa-home"></i> العودة للصفحة الرئيسية
                </a>
            </div>
        </div>
    </div>

    <footer>
        <p class="copyright">© 2025 مسار التطور التقني | تم التصميم بواسطة Mohamed Alaa</p>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        // ===== إعدادات Firebase - البيانات الصحيحة =====
        const firebaseConfig = {
            apiKey: "AIzaSyDP2FvUqV7pAt8pI1G1Mh8oxA_W6_O6Q0k",
            authDomain: "my-website-1-93db8.firebaseapp.com",
            projectId: "my-website-1-93db8",
            storageBucket: "my-website-1-93db8.appspot.com",
            messagingSenderId: "811350331643",
            appId: "1:811350331643:web:03ccde538645de11f1488e"
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ===== عناصر DOM =====
        const formTitle = document.getElementById('formTitle');
        const btnText = document.getElementById('btnText');
        const mainActionBtn = document.getElementById('mainActionBtn');
        const toggleMode = document.getElementById('toggleMode');
        const nameField = document.getElementById('nameField');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const googleBtn = document.getElementById('googleBtn');
        const forgotPasswordLink = document.getElementById('forgotPassword');
        const messageDiv = document.getElementById('message');

        let isSignUp = false;

        // ===== عرض الرسائل =====
        function showMessage(type, text) {
            messageDiv.className = `message ${type}`;
            messageDiv.innerHTML = text;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        // ===== التحقق من صحة البريد الإلكتروني =====
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        // ===== التحقق من المدخلات =====
        function validateInputs() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showMessage('error', '❌ الرجاء ملء جميع الحقول');
                return false;
            }

            if (!validateEmail(email)) {
                showMessage('error', '❌ البريد الإلكتروني غير صالح');
                return false;
            }

            if (password.length < 6) {
                showMessage('error', '❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل');
                return false;
            }

            if (isSignUp) {
                const name = nameInput.value.trim();
                if (!name) {
                    showMessage('error', '❌ الرجاء إدخال الاسم الكامل');
                    return false;
                }
            }

            return true;
        }

        // ===== التبديل بين تسجيل الدخول وإنشاء حساب =====
        toggleMode.addEventListener('click', () => {
            isSignUp = !isSignUp;
            
            if (isSignUp) {
                formTitle.textContent = 'إنشاء حساب جديد';
                btnText.textContent = 'إنشاء الحساب';
                mainActionBtn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء الحساب';
                toggleMode.innerHTML = '<i class="fas fa-sign-in-alt"></i> لديك حساب؟ سجل دخول';
                nameField.classList.add('show');
                showMessage('info', '📝 أدخل بياناتك لإنشاء حساب جديد');
            } else {
                formTitle.textContent = 'تسجيل الدخول';
                btnText.textContent = 'تسجيل الدخول';
                mainActionBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                toggleMode.innerHTML = '<i class="fas fa-user-plus"></i> ليس لديك حساب؟ سجل الآن';
                nameField.classList.remove('show');
            }
        });

        // ===== حفظ بيانات المستخدم =====
        function saveUserData(user) {
            localStorage.setItem('userId', user.uid);
            localStorage.setItem('userEmail', user.email);
            localStorage.setItem('userName', user.displayName || nameInput.value.trim() || 'مستخدم');
        }

        // ===== تسجيل الدخول =====
        async function signIn() {
            if (!validateInputs()) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            try {
                mainActionBtn.disabled = true;
                mainActionBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري تسجيل الدخول...';

                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                saveUserData(user);
                showMessage('success', '✅ تم تسجيل الدخول بنجاح! جاري التوجيه...');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                mainActionBtn.disabled = false;
                mainActionBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                
                let errorMessage = 'حدث خطأ غير متوقع';
                switch(error.code) {
                    case 'auth/user-not-found':
                        errorMessage = 'لا يوجد حساب بهذا البريد الإلكتروني';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = 'كلمة المرور غير صحيحة';
                        break;
                    case 'auth/invalid-credential':
                        errorMessage = 'بيانات الدخول غير صالحة';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = 'تم حظر الوصول مؤقتاً لكثرة المحاولات';
                        break;
                    default:
                        errorMessage = error.message;
                }
                showMessage('error', `❌ ${errorMessage}`);
            }
        }

        // ===== إنشاء حساب جديد =====
        async function signUp() {
            if (!validateInputs()) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const name = nameInput.value.trim();

            try {
                mainActionBtn.disabled = true;
                mainActionBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري إنشاء الحساب...';

                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                await user.updateProfile({
                    displayName: name
                });

                saveUserData(user);
                showMessage('success', '✅ تم إنشاء الحساب بنجاح! جاري التوجيه...');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                mainActionBtn.disabled = false;
                mainActionBtn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء الحساب';
                
                let errorMessage = 'حدث خطأ غير متوقع';
                switch(error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = 'البريد الإلكتروني مستخدم بالفعل';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'بريد إلكتروني غير صالح';
                        break;
                    case 'auth/weak-password':
                        errorMessage = 'كلمة المرور ضعيفة جداً';
                        break;
                    default:
                        errorMessage = error.message;
                }
                showMessage('error', `❌ ${errorMessage}`);
            }
        }

        // ===== تسجيل الدخول بـ Google =====
        googleBtn.addEventListener('click', async () => {
            try {
                googleBtn.disabled = true;
                googleBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الاتصال...';

                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;

                saveUserData(user);
                showMessage('success', '✅ تم تسجيل الدخول بنجاح! جاري التوجيه...');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                googleBtn.disabled = false;
                googleBtn.innerHTML = '<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="20"> <span>الدخول بحساب Google</span>';
                
                if (error.code === 'auth/popup-closed-by-user') {
                    showMessage('error', '❌ تم إغلاق نافذة التسجيل');
                } else {
                    showMessage('error', `❌ ${error.message}`);
                }
            }
        });

        // ===== نسيت كلمة المرور =====
        forgotPasswordLink.addEventListener('click', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            
            if (!email) {
                showMessage('error', '❌ الرجاء إدخال بريدك الإلكتروني أولاً');
                return;
            }

            if (!validateEmail(email)) {
                showMessage('error', '❌ البريد الإلكتروني غير صالح');
                return;
            }

            try {
                await auth.sendPasswordResetEmail(email);
                showMessage('success', '✅ تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني');
            } catch (error) {
                showMessage('error', `❌ ${error.message}`);
            }
        });

        // ===== الحدث الرئيسي للزر =====
        mainActionBtn.addEventListener('click', () => {
            if (isSignUp) {
                signUp();
            } else {
                signIn();
            }
        });

        // ===== تسجيل الدخول بضغط Enter =====
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (isSignUp) {
                    signUp();
                } else {
                    signIn();
                }
            }
        });

        // ===== التحقق من حالة تسجيل الدخول =====
        auth.onAuthStateChanged((user) => {
            if (user && window.location.pathname.includes('login.html')) {
                showMessage('info', '👋 أنت مسجل الدخول بالفعل! جاري التوجيه...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            }
        });

        // ===== رسالة ترحيب =====
        window.addEventListener('load', () => {
            setTimeout(() => {
                showMessage('info', '👋 مرحباً بك! سجل دخولك لمتابعة تقدمك');
            }, 500);
        });
    </script>
</body>
</html>
