<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Mohamed Alaa</title>
    <link rel="icon" href="icons mohamed.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #0f2027, #2c5364); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: rgba(27, 38, 59, 0.95); padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .input-group { margin-bottom: 20px; text-align: right; }
        input { width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; color: white; outline: none; transition: 0.3s; }
        input:focus { border-color: #4cc9f0; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        .btn-primary { background: linear-gradient(45deg, #4361ee, #3a0ca3); color: white; }
        .btn-google { background: #fff; color: #444; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .message { padding: 10px; border-radius: 5px; margin-bottom: 15px; display: none; font-size: 0.9rem; }
        .error { background: rgba(244, 67, 54, 0.2); border: 1px solid #f44336; color: #ff9999; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 id="title">تسجيل الدخول</h2><br>
        <div id="message" class="message"></div>
        
        <div class="input-group">
            <input type="email" id="email" placeholder="البريد الإلكتروني">
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="كلمة المرور">
        </div>
        
        <button class="btn btn-primary" id="mainBtn">دخول</button>
        <button class="btn btn-google" id="googleBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="20">
            بواسطة Google
        </button>
        <p id="toggleMode" style="cursor:pointer; margin-top:15px; font-size: 0.8rem; text-decoration: underline;">ليس لديك حساب؟ سجل الآن</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        // إعدادات مشروعك الحقيقية MY-WEBSITE-1
        const firebaseConfig = {
            apiKey: "AIzaSyDP2FvUqV7pAt8pI1G1Mh8oxA_W6_O6Q0k", 
            authDomain: "my-website-1-93db8.firebaseapp.com",
            projectId: "my-website-1-93db8",
            storageBucket: "my-website-1-93db8.appspot.com",
            messagingSenderId: "811350331643",
            appId: "1:811350331643:web:03ccde538645de11f1488e"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const messageDiv = document.getElementById('message');

        // تسجيل الدخول بجوجل
        document.getElementById('googleBtn').onclick = () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(() => window.location.href = "index.html")
                .catch((error) => {
                    messageDiv.style.display = 'block';
                    messageDiv.className = "message error";
                    messageDiv.textContent = "حدث خطأ: " + error.message;
                });
        };

        // تسجيل الدخول العادي
        document.getElementById('mainBtn').onclick = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = "index.html";
            } catch (error) {
                messageDiv.style.display = 'block';
                messageDiv.className = "message error";
                messageDiv.textContent = "خطأ في البريد أو كلمة المرور";
            }
        };
    </script>
</body>
</html>
