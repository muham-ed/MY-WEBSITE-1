<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(67, 97, 238, 0.1) 0%, transparent 20%),
                        radial-gradient(circle at 90% 80%, rgba(247, 37, 133, 0.1) 0%, transparent 20%);
            z-index: -1;
        }

        .nav-container {
            background: rgba(15, 23, 42, 0.95);
            padding: 15px 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .nav-logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(45deg, #4361ee, #3a0ca3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-link {
            color: #e0e1dd;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 5px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(67, 97, 238, 0.2);
        }

        .nav-link:hover,
        .nav-link.active {
            background: linear-gradient(45deg, #4361ee, #3a0ca3);
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.4);
        }

        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            padding-top: 100px;
        }

        .login-card {
            background: rgba(27, 38, 59, 0.95);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card h2 {
            margin-bottom: 30px;
            color: #4cc9f0;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #e0e1dd;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #4cc9f0;
            box-shadow: 0 0 0 2px rgba(76, 201, 240, 0.2);
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4361ee, #3a0ca3);
            color: white;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(67, 97, 238, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #4361ee;
            color: #4cc9f0;
            margin-top: 15px;
        }

        .btn-secondary:hover {
            background: rgba(67, 97, 238, 0.1);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #888;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 15px;
            font-size: 0.9rem;
        }

        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .social-btn.google i {
            color: #DB4437;
        }

        .social-btn.github i {
            color: #333;
        }

        .links {
            margin-top: 25px;
        }

        .links a {
            color: #4cc9f0;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
            display: block;
            margin: 8px 0;
        }

        .links a:hover {
            color: #fff;
            text-decoration: underline;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: right;
            display: none;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }

        .message.error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: #f44336;
        }

        .message.info {
            background: rgba(33, 150, 243, 0.1);
            border: 1px solid rgba(33, 150, 243, 0.3);
            color: #2196f3;
        }

        .name-group {
            display: none;
        }

        .name-group.show {
            display: block;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-icon:hover {
            background: #4361ee;
            transform: translateY(-5px);
            color: #fff;
        }

        .copyright {
            color: #e0e1dd;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .nav-content {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .login-card {
                padding: 30px 20px;
                margin: 20px;
            }

            .social-login {
                flex-direction: column;
            }
        }
    </style>
</head>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ===== إعدادات Firebase - قم بتغيير هذه القيم من لوحة تحكم Firebase =====
        const firebaseConfig = {
            apiKey: "AIzaSyB8sHpLcX5X5X5X5X5X5X5X5X5X5X5X5X5", // ضع الـ API Key الخاص بك هنا
            authDomain: "project-811350331643.firebaseapp.com",
            projectId: "project-811350331643",
            storageBucket: "project-811350331643.appspot.com",
            messagingSenderId: "811350331643",
            appId: "1:811350331643:web:abc123" // ضع الـ App ID الخاص بك هنا
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // عناصر DOM
        const title = document.getElementById('title');
        const nameGroup = document.getElementById('nameGroup');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const signUpBtn = document.getElementById('signUpBtn');
        const googleLoginBtn = document.getElementById('googleLogin');
        const githubLoginBtn = document.getElementById('githubLogin');
        const forgotPasswordLink = document.getElementById('forgotPassword');
        const messageDiv = document.getElementById('message');

        let isSignUpMode = false;

        // ===== تبديل بين تسجيل الدخول وإنشاء حساب =====
        signUpBtn.addEventListener('click', () => {
            if (!isSignUpMode) {
                isSignUpMode = true;
                title.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء حساب جديد';
                loginBtn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء الحساب';
                signUpBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> لدي حساب بالفعل';
                nameGroup.classList.add('show');
                showMessage('info', 'أدخل بياناتك لإنشاء حساب جديد');
            } else {
                isSignUpMode = false;
                title.innerHTML = '<i class="fas fa-user-circle"></i> تسجيل الدخول';
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                signUpBtn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء حساب جديد';
                nameGroup.classList.remove('show');
                showMessage('info', 'مرحباً بعودتك! سجل دخولك للمتابعة');
            }
        });

        // ===== عرض الرسائل =====
        function showMessage(type, text) {
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        // ===== التحقق من صحة الإدخال =====
        function validateInput() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (isSignUpMode) {
                const name = nameInput.value.trim();
                if (!name) {
                    showMessage('error', 'الرجاء إدخال الاسم الكامل');
                    return false;
                }
            }
            
            if (!email || !password) {
                showMessage('error', 'الرجاء ملء جميع الحقول المطلوبة');
                return false;
            }
            
            if (!validateEmail(email)) {
                showMessage('error', 'الرجاء إدخال بريد إلكتروني صحيح');
                return false;
            }
            
            if (password.length < 6) {
                showMessage('error', 'كلمة المرور يجب أن تكون 6 أحرف على الأقل');
                return false;
            }
            
            return true;
        }

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        // ===== حفظ بيانات المستخدم في Firestore =====
        async function saveUserToFirestore(user, name) {
            try {
                const userRef = db.collection('users').doc(user.uid);
                const userDoc = await userRef.get();
                
                if (!userDoc.exists) {
                    // مستخدم جديد - إنشاء سجل جديد
                    await userRef.set({
                        name: name || user.displayName || 'مستخدم',
                        email: user.email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                        photoURL: user.photoURL || null,
                        completedCourses: {
                            computer_basics: [],
                            data_analyst: [],
                            data_scientist: []
                        },
                        progress: {
                            computer_basics: 0,
                            data_analyst: 0,
                            data_scientist: 0
                        }
                    });
                    
                    console.log('تم إنشاء مستخدم جديد في Firestore');
                } else {
                    // مستخدم موجود - تحديث آخر دخول
                    await userRef.update({
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    console.log('تم تحديث آخر دخول للمستخدم');
                }
                
                // حفظ بيانات المستخدم في localStorage
                localStorage.setItem('userId', user.uid);
                localStorage.setItem('userName', name || user.displayName || 'مستخدم');
                localStorage.setItem('userEmail', user.email);
                
            } catch (error) {
                console.error('خطأ في حفظ بيانات المستخدم:', error);
            }
        }

        // ===== تحميل تقدم المستخدم من Firestore =====
        async function loadUserProgress(userId) {
            try {
                const userRef = db.collection('users').doc(userId);
                const userDoc = await userRef.get();
                
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    
                    // حفظ تقدم المستخدم في localStorage
                    if (userData.completedCourses) {
                        localStorage.setItem('completedLessons', JSON.stringify(userData.completedCourses.computer_basics || []));
                        localStorage.setItem('da_completedLessons', JSON.stringify(userData.completedCourses.data_analyst || []));
                        localStorage.setItem('ds_completedLessons', JSON.stringify(userData.completedCourses.data_scientist || []));
                    }
                    
                    return userData;
                }
            } catch (error) {
                console.error('خطأ في تحميل تقدم المستخدم:', error);
            }
        }

        // ===== إنشاء حساب جديد =====
        async function signUp() {
            if (!validateInput()) return;
            
            const name = nameInput.value.trim();
            const email = emailInput.value;
            const password = passwordInput.value;
            
            try {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري إنشاء الحساب...';
                
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                await user.updateProfile({
                    displayName: name
                });
                
                await saveUserToFirestore(user, name);
                
                showMessage('success', '🎉 تم إنشاء الحساب بنجاح! جاري تسجيل الدخول...');
                
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);
                
            } catch (error) {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء الحساب';
                
                let errorMessage = 'حدث خطأ غير متوقع';
                switch(error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = 'هذا البريد الإلكتروني مستخدم بالفعل';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'بريد إلكتروني غير صالح';
                        break;
                    case 'auth/weak-password':
                        errorMessage = 'كلمة المرور ضعيفة جداً';
                        break;
                    default:
                        errorMessage = error.message;
                }
                showMessage('error', `خطأ: ${errorMessage}`);
            }
        }

        // ===== تسجيل الدخول =====
        async function login() {
            if (!validateInput()) return;
            
            const email = emailInput.value;
            const password = passwordInput.value;
            
            try {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري تسجيل الدخول...';
                
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                await loadUserProgress(user.uid);
                
                showMessage('success', '🎉 تم تسجيل الدخول بنجاح! جاري التوجيه...');
                
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);
                
            } catch (error) {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                
                let errorMessage = 'حدث خطأ غير متوقع';
                switch(error.code) {
                    case 'auth/user-not-found':
                        errorMessage = 'لا يوجد حساب بهذا البريد الإلكتروني';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = 'كلمة المرور غير صحيحة';
                        break;
                    case 'auth/invalid-credential':
                        errorMessage = 'بيانات الدخول غير صالحة';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = 'تم حظر الوصول مؤقتاً لكثرة المحاولات';
                        break;
                    default:
                        errorMessage = error.message;
                }
                showMessage('error', `خطأ: ${errorMessage}`);
            }
        }

        // ===== تسجيل الدخول بـ Google =====
        googleLoginBtn.addEventListener('click', async () => {
            try {
                googleLoginBtn.disabled = true;
                googleLoginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الاتصال...';
                
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                await saveUserToFirestore(user, user.displayName);
                await loadUserProgress(user.uid);
                
                showMessage('success', 'تم تسجيل الدخول باستخدام Google بنجاح!');
                
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);
                
            } catch (error) {
                googleLoginBtn.disabled = false;
                googleLoginBtn.innerHTML = '<i class="fab fa-google"></i> Google';
                
                if (error.code === 'auth/popup-closed-by-user') {
                    showMessage('error', 'تم إغلاق نافذة التسجيل');
                } else {
                    showMessage('error', `خطأ: ${error.message}`);
                }
            }
        });

        // ===== تسجيل الدخول بـ GitHub =====
        githubLoginBtn.addEventListener('click', async () => {
            try {
                githubLoginBtn.disabled = true;
                githubLoginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الاتصال...';
                
                const provider = new firebase.auth.GithubAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                await saveUserToFirestore(user, user.displayName);
                await loadUserProgress(user.uid);
                
                showMessage('success', 'تم تسجيل الدخول باستخدام GitHub بنجاح!');
                
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);
                
            } catch (error) {
                githubLoginBtn.disabled = false;
                githubLoginBtn.innerHTML = '<i class="fab fa-github"></i> GitHub';
                
                if (error.code === 'auth/popup-closed-by-user') {
                    showMessage('error', 'تم إغلاق نافذة التسجيل');
                } else {
                    showMessage('error', `خطأ: ${error.message}`);
                }
            }
        });

        // ===== استعادة كلمة المرور =====
        forgotPasswordLink.addEventListener('click', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            
            if (!email) {
                showMessage('error', 'الرجاء إدخال بريدك الإلكتروني أولاً');
                return;
            }
            
            if (!validateEmail(email)) {
                showMessage('error', 'الرجاء إدخال بريد إلكتروني صحيح');
                return;
            }
            
            try {
                await auth.sendPasswordResetEmail(email);
                showMessage('success', 'تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني');
            } catch (error) {
                showMessage('error', `خطأ: ${error.message}`);
            }
        });

        // ===== التعامل مع زر تسجيل الدخول/إنشاء حساب =====
        loginBtn.addEventListener('click', () => {
            if (isSignUpMode) {
                signUp();
            } else {
                login();
            }
        });

        // ===== تسجيل الدخول بالضغط على Enter =====
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (isSignUpMode) {
                    signUp();
                } else {
                    login();
                }
            }
        });

        // ===== التحقق من حالة تسجيل الدخول =====
        auth.onAuthStateChanged((user) => {
            if (user && window.location.pathname.includes('login.html')) {
                showMessage('info', 'أنت مسجل الدخول بالفعل! جاري التوجيه...');
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);
            }
        });

        // ===== رسالة ترحيب =====
        window.addEventListener('load', () => {
            setTimeout(() => {
                showMessage('info', 'مرحباً بك في منصة التعلم! سجل دخولك لمتابعة تقدمك');
            }, 1000);
        });
    </script>
</body>
</html>
